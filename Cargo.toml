[package]
name = "bevy_interned_id"
version = "0.4.0"
edition = "2024"
authors = ["ffmulks <63452434+ffmulks@users.noreply.github.com>"]
description = "Derive macro for generating interned string ID types for Bevy, with serde and reflection integration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MolecularSadism/bevy_interned_id"
readme = "README.md"
keywords = ["bevy", "ecs", "string", "interning", "id"]
categories = ["game-development", "data-structures"]

[features]
dev = []

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.44"
syn = { version = "2.0", features = ["full", "parsing"] }

[dev-dependencies]
# Use individual bevy sub-crates to avoid system dependencies (wayland, etc.)
bevy_ecs = "0.19"
bevy_reflect = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The `bevy` facade (without default features, so no windowing/render/system
# deps) is used only to compile and run the README doc tests, which reference
# `bevy::*` paths exactly as a downstream user would.
bevy = { version = "0.19", default-features = false }
