[package]
name = "bevy_interned_id"
version = "0.6.0"
edition = "2024"
# MSRV of this proc-macro crate itself (edition 2024). The Bevy version your
# application pairs it with dictates the compiler your build actually needs.
rust-version = "1.85"
authors = ["ffmulks <63452434+ffmulks@users.noreply.github.com>"]
description = "Derive macro for generating interned string ID types for Bevy, with serde and reflection integration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MolecularSadism/bevy_interned_id"
readme = "README.md"
keywords = ["bevy", "ecs", "string", "interning", "id"]
categories = ["game-development", "data-structures"]

[features]
default = ["serde"]
# Emit serde `Serialize`/`Deserialize` impls. Requires `serde` as a direct
# dependency of the consuming crate.
serde = []
# Emit a read-only bevy-inspector-egui `InspectorPrimitive` impl. Requires
# `bevy-inspector-egui` as a direct dependency of the consuming crate.
dev = []

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.44"
syn = { version = "2.0", features = ["full", "parsing"] }

[dev-dependencies]
# Use individual bevy sub-crates to avoid system dependencies (wayland, etc.)
bevy_ecs = "0.19"
bevy_reflect = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The `bevy` facade (without default features, so no windowing/render/system
# deps) is used only to compile and run the README doc tests, which reference
# `bevy::*` paths exactly as a downstream user would.
bevy = { version = "0.19", default-features = false }
# Only needed to compile the code generated by the `dev` feature (the inspector
# UI impl). Kept `default-features = false` so it does not pull in
# bevy_render/2d/3d and the associated system dependencies. Downstream users
# supply their own `bevy-inspector-egui` when they enable the `dev` feature; it
# is a dev-dependency here purely so `--all-features` builds/tests locally and
# in CI.
bevy-inspector-egui = { version = "0.37", default-features = false }
# Benchmarks backing the README's performance claims.
criterion = "0.5"

[[bench]]
name = "id_performance"
harness = false
